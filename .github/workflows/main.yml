on:
  workflow_dispatch:
    inputs:
      network-group:
        description: "Network's group"
        type: "choice"
        options:
          - "dev"
          - "main"
          - "test"
        required: true
      network:
        description: "Network's name"
        type: "string"
        required: true
      protocol:
        description: "Protocol"
        type: "string"
        required: true
      release:
        description: "Smart contracts release"
        type: "string"
        required: true

jobs:
  nix-build:
    env:
      topology_dir: |-
        ${{ inputs.network-group }}net/${{ inputs.network }}/
      topology_json: |-
        ${{ inputs.network-group }}net/${{ inputs.network }}/topology.json
      protocols_dir: |-
        ${{ inputs.network-group }}net/${{ inputs.network }}/protocols/
      protocol_json: |-
        ${{ inputs.network-group }}net/${{ inputs.network }}/protocols/${{ inputs.protocol }}.json
    name: "Nix flake-based build"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          sparse-checkout: |-
            ./
            ${{ env.topology_dir }}
            ${{ env.protocols_dir }}
      - uses: "actions/checkout@v7"
        with:
          path: "contracts"
          ref: "48e63ce56a6d"
          repository: |-
            ${{ github.repository_owner }}/nolus-money-market
      - run: |-
          ls -l '.'

          exit 1
